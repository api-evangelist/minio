aid: minio
name: MinIO
description: >-
  MinIO is a high-performance, S3-compatible object storage system built for
  large-scale AI, analytics, and cloud-native data infrastructure. Its API is
  a drop-in implementation of the Amazon S3 REST API (bucket and object
  operations, multipart uploads, versioning, object locking / WORM retention,
  lifecycle policies, replication, and encryption), authenticated with AWS
  Signature Version 4 using access-key/secret-key pairs. Alongside the S3 data
  API, MinIO ships an Admin API (madmin) for cluster, user, policy, and
  service management. It is distributed as open-source software and as the
  commercial AIStor product, deployed on Kubernetes via an operator and Helm
  charts, and driven through first-party SDKs for Go, Python, Java, JavaScript,
  .NET, C++, and Rust plus the `mc` command-line client.
