generated: '2026-07-20'
method: searched
source: https://min.io/product/s3-compatibility (S3 REST API error responses that MinIO returns)
format: s3-xml-error
envelope:
  content_type: application/xml
  shape: <Error><Code/><Message/><Resource/><RequestId/><Key/><BucketName/></Error>
  request_id_headers: [x-amz-request-id, x-amz-id-2]
note: >-
  MinIO returns the standard S3 REST API error codes. HTTP status is carried on
  the response; the machine-readable identifier is the <Code> element. Listing
  the most common codes; MinIO also emits additional server-specific codes
  (e.g. XMinioAdmin* on the admin API).
errors:
- code: NoSuchBucket
  status: 404
  message: The specified bucket does not exist.
- code: NoSuchKey
  status: 404
  message: The specified key does not exist.
- code: NoSuchUpload
  status: 404
  message: The specified multipart upload does not exist.
- code: BucketAlreadyOwnedByYou
  status: 409
  message: The bucket you tried to create already exists and you own it.
- code: BucketAlreadyExists
  status: 409
  message: The requested bucket name is not available.
- code: BucketNotEmpty
  status: 409
  message: The bucket you tried to delete is not empty.
- code: AccessDenied
  status: 403
  message: Access Denied.
- code: SignatureDoesNotMatch
  status: 403
  message: The request signature we calculated does not match the signature you provided.
- code: InvalidAccessKeyId
  status: 403
  message: The access key ID you provided does not exist in our records.
- code: ExpiredToken
  status: 400
  message: The provided token has expired.
- code: EntityTooLarge
  status: 400
  message: Your proposed upload exceeds the maximum allowed object size.
- code: EntityTooSmall
  status: 400
  message: Your proposed upload is smaller than the minimum allowed object size.
- code: InvalidArgument
  status: 400
  message: Invalid argument.
- code: InvalidBucketName
  status: 400
  message: The specified bucket is not valid.
- code: InvalidRequest
  status: 400
  message: Invalid request.
- code: MalformedXML
  status: 400
  message: The XML you provided was not well-formed or did not validate against the schema.
- code: MissingContentLength
  status: 411
  message: You must provide the Content-Length HTTP header.
- code: PreconditionFailed
  status: 412
  message: At least one of the preconditions you specified did not hold.
- code: SlowDown
  status: 503
  message: Please reduce your request rate.
- code: InternalError
  status: 500
  message: We encountered an internal error. Please try again.
- code: NotImplemented
  status: 501
  message: A header or functionality you provided implies functionality that is not implemented.
